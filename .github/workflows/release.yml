name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag (for example v0.1.1)
        required: true
        type: string
      target:
        description: Branch or commit to tag
        required: false
        default: main
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Workflow inputs reach the scripts below as environment variables, and
    # "Validate version" checks the format before any other step uses it.
    env:
      VERSION: ${{ inputs.version }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The version input is not a SemVer tag. Start the workflow again with a value like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Start the workflow again with the next unreleased version." >&2
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Docker images are published by the ci workflow as $REGISTRY/$IMAGE_NAME:$VERSION, semver aliases, and sha tags."
